name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  r-tests:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: duboisR
          extra-packages: any::rcmdcheck
          needs: check

      # error-on: only fail the build on genuine ERRORs (build/test failures),
      # not the WARNING/NOTE-level CRAN-submission nitpicks (missing URLs,
      # non-ASCII text, etc.) that don't matter for a research-support
      # package that isn't going to CRAN. Tests failing is an ERROR, so this
      # still does exactly what the gate is for: block merges on failing
      # tests, don't block them on documentation style.
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: duboisR
          error-on: '"error"'
          upload-snapshots: false

  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: pytest python/tests -v
